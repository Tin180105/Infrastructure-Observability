# Giai đoạn đầu: chỉ xem cảnh báo trên giao diện Alertmanager (http://localhost:9093).
# Khi có backend FastAPI, bỏ comment webhook_configs để gửi cảnh báo về backend (tính MTTD).
route:
  receiver: default
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default
